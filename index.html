<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worksheet Studio 5.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef4ff;color:#172033}
.app{max-width:1200px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#6c4cff,#00b8d9);color:#fff;border-radius:22px;padding:24px;margin-bottom:16px}
.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;opacity:.95}
.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 28px #17325d18;margin-bottom:16px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label{font-weight:700;font-size:14px}select,input{width:100%;margin-top:6px;padding:12px;border:2px solid #dce5f5;border-radius:12px;background:#fff;font-size:15px}
.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
button{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;background:#6c4cff;color:#fff}
button.secondary{background:#172033}button.light{background:#e9efff;color:#31415f}
#status{margin-top:12px;padding:10px 12px;border-radius:10px;background:#edf8f2;color:#146b42;display:none;font-weight:700}
#status.err{background:#fff0f0;color:#b42318}
#preview{overflow:auto;background:#dfe7f4;padding:18px;border-radius:16px}
.page{width:210mm;min-height:297mm;margin:0 auto 18px;background:#fff;padding:15mm;position:relative;break-after:page;box-shadow:0 5px 18px #0002;overflow:hidden}
.page h2{margin:0 0 8px;font-size:26px}.page h3{margin:12px 0 7px}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#e9e3ff;color:#4b2dcc;font-weight:800;font-size:12px}
.namebox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.line{border-bottom:2px solid #555;min-height:27px}
.card{border:2px solid #dbe4f2;border-radius:14px;padding:12px;margin:9px 0;background:#fbfdff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{min-height:48px;border-bottom:2px dashed #98a6bb;margin-top:7px}
.draw{height:145px;border:3px dashed #9aa9bd;border-radius:14px;margin-top:8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match div{border:2px solid #d9e2ef;padding:10px;border-radius:10px;min-height:45px}
.footer{position:absolute;bottom:8mm;left:15mm;right:15mm;display:flex;justify-content:space-between;font-size:11px;color:#667085}
.ok{font-weight:800}.small{font-size:12px;color:#667085}
@media(max-width:800px){.controls{grid-template-columns:1fr}.page{transform-origin:top left;width:210mm}}
@media print{
 body{background:#fff}.app{max-width:none;padding:0}.hero,.panel:not(.print-panel),.no-print{display:none!important}
 #preview{padding:0;background:#fff;overflow:visible}.page{margin:0;box-shadow:none;width:210mm;height:297mm;min-height:297mm}
}
</style>
</head>
<body>
<div class="app">
  <div class="hero no-print">
    <h1>🚀 Worksheet Studio 5.0</h1>
    <p>Generator worksheet A4 SD Kelas 1–6 • tanpa login • tanpa API • siap GitHub Pages</p>
  </div>

  <div class="panel no-print">
    <div class="controls">
      <div><label for="kelas">Kelas</label><select id="kelas"></select></div>
      <div><label for="mapel">Mata Pelajaran</label><select id="mapel"></select></div>
      <div><label for="materi">Materi</label><select id="materi"></select></div>
      <div><label for="bentuk">Bentuk Worksheet</label><select id="bentuk">
        <option value="aktif">Latihan Aktif</option><option value="petualangan">Misi Petualangan</option>
        <option value="kartu">Kartu Belajar</option><option value="komik">Komik Mini</option>
        <option value="refleksi">Jurnal Refleksi</option><option value="proyek">Mini Proyek</option>
      </select></div>
      <div><label for="tema">Tema Visual</label><select id="tema">
        <option>Space Adventure</option><option>Ocean Explorer</option><option>Animal Fun</option>
        <option>Pastel Rainbow</option><option>Science Lab</option><option>Islamic Elegant</option>
      </select></div>
      <div><label for="judul">Judul Worksheet</label><input id="judul" value="Petualangan Belajar Hari Ini"></div>
    </div>
    <div class="buttons">
      <button id="generate" type="button">✨ Generate Worksheet</button>
      <button id="variasi" class="secondary" type="button">🔄 Variasi Soal</button>
      <button id="print" class="light" type="button">🖨️ Cetak / Simpan PDF</button>
      <button id="reset" class="light" type="button">↩ Reset</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="panel print-panel">
    <div id="preview"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var DB={
1:{
 "Matematika":["Bilangan sampai 20","Penjumlahan","Pengurangan","Bentuk dan Pola"],
 "Bahasa Indonesia":["Menyimak Cerita","Membaca Kata","Kosakata","Kalimat Sederhana"],
 "Bahasa Inggris":["Greetings","Numbers","Colors","Animals"],
 "PAI":["Huruf Hijaiyah","Rukun Islam","Adab Sehari-hari","Doa Harian"],
 "IPAS":["Tubuhku","Keluargaku","Hewan dan Tumbuhan","Lingkungan Rumah"]
},
2:{
 "Matematika":["Bilangan sampai 100","Penjumlahan dan Pengurangan","Bangun Datar","Pengukuran"],
 "Bahasa Indonesia":["Cerita Pendek","Kalimat Tanya","Kosakata","Pesan Cerita"],
 "Bahasa Inggris":["Family","School Objects","Days","Simple Commands"],
 "PAI":["Wudu","Salat","Akhlak Terpuji","Nabi dan Rasul"],
 "IPAS":["Makhluk Hidup","Benda di Sekitar","Cuaca","Lingkungan Bersih"]
},
3:{
 "Matematika":["Perkalian","Pembagian","Pecahan Sederhana","Keliling"],
 "Bahasa Indonesia":["Ide Pokok","Informasi Teks","Kalimat Efektif","Puisi Anak"],
 "Bahasa Inggris":["Hobbies","Food and Drinks","My House","Daily Activities"],
 "PAI":["Salat Berjamaah","Asmaul Husna","Puasa","Kisah Nabi"],
 "IPAS":["Siklus Hidup","Gaya","Energi","Lingkungan"]
},
4:{
 "Matematika":["Pecahan","KPK dan FPB","Bangun Datar","Data Sederhana"],
 "Bahasa Indonesia":["Gagasan Pokok","Teks Deskripsi","Wawancara","Ringkasan"],
 "Bahasa Inggris":["My Daily Routine","Animals","Places","Describing People"],
 "PAI":["Al-Qur'an dan Hadis","Salat","Akhlak","Keragaman"],
 "IPAS":["Tumbuhan","Sumber Energi","Gaya dan Gerak","Keragaman Budaya"]
},
5:{
 "Matematika":["Pecahan dan Desimal","Volume","Bangun Ruang","Data"],
 "Bahasa Indonesia":["Teks Eksplanasi","Iklan","Ide Pokok","Ringkasan"],
 "Bahasa Inggris":["Daily Life","Public Places","Food","Simple Present"],
 "PAI":["Iman kepada Allah","Zakat","Puasa","Akhlak"],
 "IPAS":["Ekosistem","Siklus Air","Energi","Indonesia dan Lingkungannya"]
},
6:{
 "Matematika":["Operasi Pecahan","Perbandingan","Luas dan Volume","Data dan Diagram"],
 "Bahasa Indonesia":["Pidato","Teks Informasi","Simpulan","Surat"],
 "Bahasa Inggris":["Simple Present","Directions","School Life","Describing Objects"],
 "PAI":["Iman dan Hari Akhir","Zakat dan Sedekah","Akhlak Terpuji","Sejarah Islam"],
 "IPAS":["Tata Surya","Listrik","Perubahan Lingkungan","Kegiatan Ekonomi"]
}};
var $=function(id){return document.getElementById(id);};
var kelas=$("kelas"),mapel=$("mapel"),materi=$("materi"),preview=$("preview"),status=$("status");

function fill(){
 kelas.innerHTML="";
 for(var i=1;i<=6;i++){var o=document.createElement("option");o.value=i;o.textContent="Kelas "+i;kelas.appendChild(o);}
 mapel.innerHTML="";
 Object.keys(DB[1]).forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n;mapel.appendChild(o);});
 updateMateri();
}
function updateMateri(){
 materi.innerHTML="";
 (DB[Number(kelas.value)][mapel.value]||[]).forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n;materi.appendChild(o);});
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function rand(n){return Math.floor(Math.random()*n);}
function mathQ(k){
 if(k<=2){var a=5+rand(15),b=1+rand(10);return [a+" + "+b+" = ______",a+" - "+b+" = ______",b+" + "+(a-b)+" = ______"];}
 if(k<=4){var a=10+rand(40),b=2+rand(15);return [a+" × "+b+" = ______",a+" + "+b+" = ______",a+" - "+b+" = ______"];}
 return [(20+rand(30))+" + "+(10+rand(20))+" = ______",(3+rand(7))+" × "+(4+rand(6))+" = ______",(60+rand(30))+" − "+(10+rand(20))+" = ______"];
}
function content(){
 var k=Number(kelas.value),m=mapel.value,ma=materi.value;
 if(m==="Matematika") return {intro:"Perhatikan angka, bentuk, atau situasi pada materi ini. Tulis langkahmu dengan rapi.",q:mathQ(k),extra:"Buat satu soal serupa dengan caramu sendiri."};
 if(m==="Bahasa Indonesia") return {intro:"Bacalah teks pendek berikut. Temukan informasi penting dan sampaikan jawaban dengan kalimatmu sendiri.",q:["Tuliskan ide pokok atau informasi terpenting dari materi: "+ma+".","Tuliskan 2 kata baru yang kamu pelajari.","Buat satu kalimat menggunakan salah satu kata tersebut."],extra:"Gambarkan satu kejadian yang sesuai dengan topik bacaan."};
 if(m==="Bahasa Inggris") return {intro:"Read, say, and write. Use simple English words related to the selected topic.",q:["Write 3 English words about: "+ma+".","Match one word with its Indonesian meaning.","Write one simple sentence using a word you learned."],extra:"Draw one object/person/animal related to the topic and label it in English."};
 if(m==="PAI") return {intro:"Pahami materi dengan menghubungkan pengetahuan dengan kebiasaan baik dalam kehidupan sehari-hari.",q:["Sebutkan satu hal penting tentang "+ma+".","Tuliskan contoh perilaku yang sesuai dengan materi.","Apa manfaat menerapkan materi ini dalam kehidupan sehari-hari?"],extra:"Tuliskan satu kebiasaan baik yang akan kamu lakukan hari ini."};
 return {intro:"Amati lingkungan sekitar. Hubungkan materi dengan benda, makhluk hidup, atau peristiwa yang kamu temui.",q:["Tuliskan satu hal yang kamu ketahui tentang "+ma+".","Sebutkan dua contoh yang dapat kamu temukan di sekitar.","Apa hasil pengamatanmu? Jelaskan singkat."],extra:"Gambarkan hasil pengamatanmu dan beri 3 label."};
}
function pageHead(title,sub){
 return '<span class="badge">'+esc(mapel.value)+' • Kelas '+esc(kelas.value)+'</span><h2>'+esc(title)+'</h2><p>'+esc(sub)+'</p>';
}
function generate(){
 try{
  var k=Number(kelas.value), ma=materi.value, title=$("judul").value.trim()||"Petualangan Belajar Hari Ini", type=$("bentuk").value, data=content();
  var html="";
  html+='<section class="page">'+pageHead(title,"Worksheet A4 • Tema: "+$("tema").value)+
   '<div class="namebox"><div>Nama<div class="line"></div></div><div>Tanggal<div class="line"></div></div></div>'+
   '<div class="card"><h3>🎯 Tujuan Belajar</h3><p>Hari ini aku belajar tentang <b>'+esc(ma)+'</b>. Aku akan membaca, berpikir, menulis, dan membuat karya.</p></div>'+
   '<div class="card"><h3>🧠 Sebelum Mulai</h3><p>Yang sudah aku ketahui tentang materi ini:</p><div class="answer"></div><div class="answer"></div></div>'+
   '<div class="card"><h3>⭐ Tantangan</h3><p>'+esc(data.intro)+'</p></div>'+
   '<div class="footer"><span>Worksheet Studio 5.0</span><span>1 / 4</span></div></section>';

  html+='<section class="page">'+pageHead("Kenali Konsep","Baca, amati, lalu lengkapi bagian yang kosong.")+
   '<div class="card"><h3>📚 Ringkasan Mini</h3><p><b>'+esc(ma)+'</b> adalah topik yang dapat kita pahami melalui contoh, pengamatan, dan latihan. Tuliskan dengan bahasamu sendiri apa yang kamu pahami.</p><div class="answer"></div><div class="answer"></div></div>'+
   '<div class="card"><h3>🔎 Ayo Amati</h3><p>Cari satu contoh dari materi ini di rumah, sekolah, atau lingkunganmu. Tuliskan contohnya.</p><div class="answer"></div></div>'+
   '<div class="grid2"><div class="card"><b>Kata/angka penting</b><div class="answer"></div></div><div class="card"><b>Contoh</b><div class="answer"></div></div></div>'+
   '<div class="footer"><span>Belajar aktif</span><span>2 / 4</span></div></section>';

  var qhtml=data.q.map(function(q,i){return '<div class="card"><b>'+(i+1)+'. '+esc(q)+'</b><div class="answer"></div><div class="answer"></div></div>';}).join("");
  html+='<section class="page">'+pageHead(type==="komik"?"Komik Mini: "+ma:"Latihan Aktif","Gunakan lebih dari satu cara untuk menunjukkan pemahamanmu.")+
   (type==="komik"?'<div class="grid2"><div class="card" style="height:125px"><b>Panel 1</b><div class="small">Gambarkan awal cerita.</div></div><div class="card" style="height:125px"><b>Panel 2</b><div class="small">Gambarkan kejadian utama.</div></div><div class="card" style="height:125px"><b>Panel 3</b><div class="small">Gambarkan akhir.</div></div><div class="card" style="height:125px"><b>Dialog</b><div class="small">Tuliskan 1–2 kalimat.</div></div></div>':qhtml)+
   '<div class="card"><h3>🔗 Cocokkan / Lengkapi</h3><div class="match"><div>A. Konsep utama</div><div>1. Contoh yang sesuai</div><div>B. Kata penting</div><div>2. Penjelasan singkat</div><div>C. Penerapan</div><div>3. Manfaat dalam kehidupan</div></div></div>'+
   '<div class="footer"><span>Latihan</span><span>3 / 4</span></div></section>';

  html+='<section class="page">'+pageHead("Karya & Refleksi","Tunjukkan pemahamanmu dengan gambar, mini proyek, dan refleksi.")+
   '<div class="card"><h3>🎨 '+esc(data.extra)+'</h3><div class="draw"></div></div>'+
   '<div class="card"><h3>🛠️ Mini Proyek</h3><p>Langkah 1: Siapkan alat sederhana. Langkah 2: Buat atau amati sesuatu yang berkaitan dengan <b>'+esc(ma)+'</b>. Langkah 3: Catat hasilnya.</p><div class="answer"></div><div class="answer"></div></div>'+
   '<div class="card"><h3>💭 Refleksi</h3><p>Hal paling menarik hari ini adalah...</p><div class="answer"></div><p>Aku masih ingin belajar tentang...</p><div class="answer"></div><p>Perasaanku setelah belajar: ⭐ ⭐ ⭐ ⭐ ⭐</p></div>'+
   '<div class="footer"><span>Hebat, kamu sudah selesai!</span><span>4 / 4</span></div></section>';
  preview.innerHTML=html;
  status.className="";status.style.display="block";status.textContent="✅ Worksheet berhasil dibuat. Gulir ke bawah untuk melihat 4 halaman A4.";
 }catch(e){status.className="err";status.style.display="block";status.textContent="❌ Gagal membuat worksheet: "+e.message;preview.innerHTML="";}
}
kelas.addEventListener("change",updateMateri);mapel.addEventListener("change",updateMateri);
$("generate").addEventListener("click",generate);
$("variasi").addEventListener("click",generate);
$("print").addEventListener("click",function(){if(!preview.innerHTML.trim())generate();window.print();});
$("reset").addEventListener("click",function(){kelas.value="1";mapel.value="Matematika";$("judul").value="Petualangan Belajar Hari Ini";$("bentuk").value="aktif";$("tema").value="Space Adventure";updateMateri();generate();});
fill();generate();
})();
</script>
</body>
</html>
